<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#dc2626">
    <title>Offline · Nubia Inventory</title>
    <style>
        :root { color-scheme: light dark; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: "Segoe UI", system-ui, sans-serif;
            background: #0a0a0a;
            color: #f5f5f5;
        }
        .card {
            width: min(420px, 100%);
            text-align: center;
            padding: 32px 24px;
            border-radius: 20px;
            background: #141414;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .mark {
            width: 64px; height: 64px; margin: 0 auto 18px;
            border-radius: 16px; display: grid; place-items: center;
            background: linear-gradient(145deg, #dc2626, #991b1b);
            font-weight: 800; font-size: 1.6rem;
        }
        h1 { margin: 0 0 8px; font-size: 1.45rem; letter-spacing: -0.03em; }
        p { margin: 0 0 22px; color: #a3a3a3; line-height: 1.5; font-size: 0.95rem; }
        button {
            appearance: none; border: 0; cursor: pointer;
            background: #dc2626; color: #fff; font-weight: 700;
            padding: 12px 20px; border-radius: 12px; font-size: 0.95rem;
        }
        button:hover { background: #b91c1c; }
    </style>
</head>
<body>
    <div class="card">
        <div class="mark" aria-hidden="true">N</div>
        <h1>You're offline</h1>
        <p>Nubia needs a connection for live inventory and sales data. Check your network, then try again.</p>
        <button type="button" onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
